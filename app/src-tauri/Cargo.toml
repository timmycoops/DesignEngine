[package]
name = "zd-app"
description = "Tauri shell for the Zovlyn Pit Design Engine: command bridge and binary mesh transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zd-core.workspace = true
zd-geom.workspace = true
zd-io.workspace = true
zd-commands.workspace = true

# Zero-copy mesh hand-over through WebView2 shared buffers. Same versions Tauri's wry uses, so the
# interface types match those `PlatformWebview` hands out; windows-core supplies `Interface::cast`.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
