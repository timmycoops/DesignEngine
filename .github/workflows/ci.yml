name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which jobs have anything to build yet. The Rust workspace and the app
  # are created in Phase 0, so until then those jobs are skipped instead of failing.
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.files.outputs.rust }}
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f app/package.json ]; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi

  engine:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Test engine crates
        run: cargo test --workspace --exclude zd-app --exclude bench
      - name: Lint
        run: cargo clippy --workspace --exclude zd-app --exclude bench -- -D warnings

  app:
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
