name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    # Runs once the Rust workspace exists (Phase 0 creates it).
    if: ${{ hashFiles('Cargo.toml') != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Test engine crates
        run: cargo test --workspace --exclude zd-app --exclude bench
      - name: Lint
        run: cargo clippy --workspace --exclude zd-app --exclude bench -- -D warnings

  app:
    # Runs once the Tauri app exists.
    if: ${{ hashFiles('app/package.json') != '' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
