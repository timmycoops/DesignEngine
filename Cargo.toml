[workspace]
resolver = "3"
members = [
    "crates/zd-core",
    "crates/zd-geom",
    "crates/zd-io",
    "crates/zd-commands",
    "crates/zd-reserves",
    "crates/zd-script",
    "crates/zd-licence",
    "crates/zd-py",
    "bench",
    "app/src-tauri",
]
# Patched copies of crates, used through [patch.crates-io] below; never members, so never linted or tested here.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
zd-core = { path = "crates/zd-core" }
zd-geom = { path = "crates/zd-geom" }
zd-io = { path = "crates/zd-io" }
zd-commands = { path = "crates/zd-commands" }
zd-reserves = { path = "crates/zd-reserves" }
zd-script = { path = "crates/zd-script" }
zd-licence = { path = "crates/zd-licence" }
manifold-csg = "0.4.1"
serde = { version = "1", features = ["derive"] }
# The locked Parquet/Arrow layer for the project store; only the Arrow bridge and Snappy codec.
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
arrow-array = "60"
arrow-schema = "60"
# Parquet's own in-memory buffer, already in the build through parquet: the only way it reads from memory (0058).
bytes = "1"
# Solids come as zips of thousands of files (Spry exports them so); deflate is all they use.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# float_roundtrip: run logs must give back the exact f64 coordinates they were given.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Deswik .dcf drawings are zips of VectorDraw XML with base64 arrays (decision 0036); both crates were
# already in the app's build through Tauri.
quick-xml = "0.38.4"
base64 = "0.22.1"
# Spry projects (.spry) are SQLite with LZ4 blocks (decision 0039), agreed by Tim (2026-11-03). bundled: SQLite
# is built in, so nothing is installed beside the app.
rusqlite = { version = "0.41.1", features = ["bundled"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
parry3d-f64 = "0.31.1"
# Starlark for the formulas a planner edits (decision 0077, agreed by Tim 2026-11-16): Python's syntax, sandboxed, the
# same answer every run. Pinned exactly with its derive crate; allocative and anyhow are what its own types use.
starlark = "=0.14.2"
starlark_derive = "=0.14.2"
allocative = "0.3.6"
anyhow = "1"
spade = "2.15.1"
meshopt = "0.7.0"

# Starlark without serde_json's `arbitrary_precision`, which it asks for and Cargo would turn on across the whole build,
# breaking every untagged or flattened number the app reads (decision 0077; vendor/starlark/ZOVLYN.md).
[patch.crates-io]
starlark = { path = "vendor/starlark" }

# Build the C++ Manifold kernel and the BVH code optimised even in dev builds:
# a debug Manifold makes every test and `tauri dev` session crawl.
[profile.dev.package.manifold-csg-sys]
opt-level = 3

[profile.dev.package.manifold-csg]
opt-level = 3

[profile.dev.package.parry3d-f64]
opt-level = 3
